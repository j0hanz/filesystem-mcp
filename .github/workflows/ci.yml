# Runs on agent PRs without manual approval: keep this workflow secret-free and contents:read.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Pull requests cancel their own superseded runs. Pushes get one group per
# ref and commit, so every commit on main/dev keeps a complete result: the
# release workflow checks that result before it tags (plan 063).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One OS failing must not cancel the other: the point is to see both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Mirrors package.json's check script (check:static + test) as separate
    # steps, so one failure does not hide the others. Keep the two in sync.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: Build
        id: build
        run: npm run build
      - name: Type-check tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run type-check:test
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx prettier --check .
      - name: Knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx knip
      - name: Test
        # dist-smoke boots dist/index.js, so tests need a successful build.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.os != 'ubuntu-latest' }}
        run: npm test
      - name: Test with coverage floor
        # Ubuntu runs the POSIX-only sandbox branches; the floor lives in
        # package.json test:coverage. Raise it when coverage rises; never lower it
        # without a recorded reason.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        run: npm run test:coverage

  release-paths:
    name: Release build paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/check-release-paths.sh
